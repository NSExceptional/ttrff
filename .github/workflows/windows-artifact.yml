# Build the portable Windows artifact and publish it to the rolling "windows-latest"
# release. The Scoop manifest lives in the NSCake/scoop-bucket repo (the Windows analog
# of the nscake homebrew tap) and points at releases/latest/download/ttrff-windows.zip;
# that bucket's sync-manifests workflow refreshes the manifest hash/version on a
# schedule. This workflow only builds + uploads: push -> new artifact -> the bucket syncs
# -> `scoop update` picks it up -- the Windows counterpart of the Homebrew --HEAD flow.
name: windows-artifact

on:
  push:
    branches: [main]
    paths:
      - 'tray/**'
      - 'frida/**'
      - 'scripts/tt-mod-stop.cmd'
      - 'modset.json'
      - 'offsets.json'
      - 'capi-symbols*.json'
      - 'packaging/**'
      - '.github/workflows/windows-artifact.yml'
  workflow_dispatch:

# Serialize runs so overlapping builds don't race on the release upload.
concurrency:
  group: windows-artifact
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build artifact
        shell: pwsh
        run: ./packaging/build-artifact.ps1

      - name: Upload artifact (CI)
        uses: actions/upload-artifact@v4
        with:
          name: ttrff-windows
          path: dist/ttrff-windows.zip

      - name: Publish to rolling release
        shell: pwsh
        run: |
          $tag = "windows-latest"
          $rel = gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null
          if (-not $rel) {
            gh release create $tag --repo $env:GITHUB_REPOSITORY `
              --title "ttrff Windows (rolling)" `
              --notes "Rolling builds of main. One IMMUTABLE zip per CI run (ttrff-windows-<run>.zip); the Scoop manifest (NSCake/scoop-bucket) points at the newest. Old assets are pruned to the latest 5."
          }
          # IMMUTABLE per-run asset: never clobber a fixed-name zip (a concurrent build
          # would change the bytes under a hash the bucket already recorded -- observed as
          # a hash-check failure). The bucket sync discovers the newest run-numbered asset.
          # NB: gh's `file#label` syntax sets a display LABEL, not the asset name -- so
          # rename the file itself before upload.
          Copy-Item dist/ttrff-windows.zip "dist/ttrff-windows-$env:GITHUB_RUN_NUMBER.zip"
          gh release upload $tag "dist/ttrff-windows-$env:GITHUB_RUN_NUMBER.zip" --repo $env:GITHUB_REPOSITORY
          # remove the legacy fixed-name asset (superseded by the run-numbered ones) and
          # prune: keep only the newest 5 run-numbered assets so the release doesn't grow.
          gh release delete-asset $tag ttrff-windows.zip --repo $env:GITHUB_REPOSITORY --yes 2>$null
          gh release view $tag --repo $env:GITHUB_REPOSITORY --json assets -q '.assets[].name' |
            Where-Object { $_ -match '^ttrff-windows-(\d+)\.zip$' } |
            Sort-Object { [int]($_ -replace '^ttrff-windows-(\d+)\.zip$','$1') } -Descending |
            Select-Object -Skip 5 |
            ForEach-Object { gh release delete-asset $tag $_ --repo $env:GITHUB_REPOSITORY --yes }
        env:
          GH_TOKEN: ${{ github.token }}
