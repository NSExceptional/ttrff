# Build the portable Windows artifact and publish it to the rolling "windows-latest"
# release. The Scoop manifest lives in the NSCake/scoop-bucket repo (the Windows analog
# of the nscake homebrew tap) and points at releases/latest/download/ttrff-windows.zip;
# that bucket's sync-manifests workflow refreshes the manifest hash/version on a
# schedule. This workflow only builds + uploads: push -> new artifact -> the bucket syncs
# -> `scoop update` picks it up -- the Windows counterpart of the Homebrew --HEAD flow.
name: windows-artifact

on:
  push:
    branches: [main]
    paths:
      - 'tray/**'
      - 'frida/**'
      - 'scripts/tt-mod-stop.cmd'
      - 'modset.json'
      - 'offsets.json'
      - 'capi-symbols*.json'
      - 'packaging/**'
      - '.github/workflows/windows-artifact.yml'
  workflow_dispatch:

# Serialize runs so overlapping builds don't race on the release upload.
concurrency:
  group: windows-artifact
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build artifact
        shell: pwsh
        run: ./packaging/build-artifact.ps1

      - name: Upload artifact (CI)
        uses: actions/upload-artifact@v4
        with:
          name: ttrff-windows
          path: dist/ttrff-windows.zip

      - name: Publish to rolling release
        shell: pwsh
        run: |
          $tag = "windows-latest"
          $rel = gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null
          if (-not $rel) {
            gh release create $tag --repo $env:GITHUB_REPOSITORY `
              --title "ttrff Windows (rolling)" `
              --notes "Rolling build of main. Rebuilt on every push; the Scoop manifest (NSCake/scoop-bucket) points here. Not a versioned release."
          }
          gh release upload $tag dist/ttrff-windows.zip --repo $env:GITHUB_REPOSITORY --clobber
        env:
          GH_TOKEN: ${{ github.token }}
